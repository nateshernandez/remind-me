name: redspec
on:
  pull_request:
  push:
    branches: [main]
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The gate. Red on a skeleton is correct; red on main is a stop.
      #
      # `pnpm spec`, not `pnpm exec redspec check`: the CLI loads specs/ with
      # jiti, jiti ignores tsconfig paths unless JITI_TSCONFIG_PATHS=1 is set,
      # and the sketches import `@/components/ui/*`. The bare invocation dies
      # on `Cannot find module '@/lib/utils'`. The script sets it.
      - run: pnpm spec
      - run: pnpm test
      # RULE-access-session and RULE-access-code are on the `type` rung, so the
      # compiler is their check and this line is where they can go red. Every
      # @ts-expect-error in their tests is an assertion tsc reads.
      - run: pnpm typecheck
